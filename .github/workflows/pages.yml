# GitHub Pages für ssco-hackathon-t2/azimut (Basis-Pfad /azimut, kommt aus configure-pages).
# Action-Versionen geprüft am 22.10.2026 (Releases der jeweiligen Actions, docs.github.com/pages).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        # Version aus package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - id: pages
        uses: actions/configure-pages@v6
      - name: Statischer Export unter dem Repository-Unterpfad
        run: pnpm build
        env:
          # z. B. "/azimut"; leer bei eigener Domain
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
